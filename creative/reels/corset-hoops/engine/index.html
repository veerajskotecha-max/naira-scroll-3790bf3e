<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: CG; src: url('../../fonts/CG.ttf'); font-weight: 300 700; }
@font-face { font-family: CG; font-style: italic; src: url('../../fonts/CG-Italic.ttf'); font-weight: 300 700; }
@font-face { font-family: Jost; src: url('../../fonts/Jost.ttf'); font-weight: 100 900; }
:root { --ivory:#FBF3EC; --ink:#1A1614; --blush:#FFBDA8; --sage:#99B4AF; --deep:#50726A; }
html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#151211; }
#stage { position:absolute; inset:0; overflow:hidden; background:#151211; }
.panel { position:absolute; inset:0; overflow:hidden; }
.panel img, .panel canvas { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:0 0; display:block; }
.abs { position:absolute; left:0; top:0; }
#behind, #fg, #ui { position:absolute; inset:0; }
#behind { overflow:hidden; }
#ov { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:visible; }
/* type */
.t { position:absolute; white-space:nowrap; will-change:transform,opacity; }
.cg { font-family:CG; font-style:italic; font-weight:500; color:var(--ivory); line-height:1.02;
      filter:drop-shadow(0 2px 12px rgba(26,22,20,.55)) drop-shadow(0 1px 2px rgba(26,22,20,.5)); }
.kick { font-family:Jost; font-weight:500; text-transform:uppercase; letter-spacing:.22em; color:var(--ivory);
      filter:drop-shadow(0 1px 6px rgba(26,22,20,.7)) drop-shadow(0 1px 1px rgba(26,22,20,.6)); }
.print { color:var(--deep); filter:drop-shadow(0 0 10px rgba(251,243,236,.85)) drop-shadow(0 0 2px rgba(251,243,236,.9)); }
.center { text-align:center; }
/* giant type that sits behind her; sizes are fitted to the frame once the fonts are in */
.big { position:absolute; left:0; width:1080px; text-align:center; white-space:nowrap; font-family:Jost; font-weight:600; letter-spacing:.01em; line-height:.86; color:var(--deep); will-change:transform,opacity; }
.bigi { position:absolute; left:0; width:1080px; text-align:center; white-space:nowrap; font-family:CG; font-style:italic; font-weight:600; line-height:.9; color:var(--deep); font-feature-settings:"lnum" 1; }
.marq { position:absolute; left:-400px; width:2400px; height:96px; background:var(--blush); overflow:hidden; box-shadow:0 10px 26px rgba(26,22,20,.18); transform-origin:50% 50%; }
.marq .mq { position:absolute; left:0; top:0; white-space:nowrap; font-family:Jost; font-weight:600; font-size:50px; line-height:96px; letter-spacing:.14em; color:var(--deep); }
/* product tag: the brand's sharp corners, ivory card, blush hairline */
.tag { position:absolute; width:420px; height:176px; background:var(--ivory); box-shadow:0 14px 30px rgba(26,22,20,.32), 0 2px 5px rgba(26,22,20,.2); }
.tag::after { content:''; position:absolute; inset:9px; border:2px solid var(--blush); }
.tag .nm { position:absolute; left:30px; top:28px; font-family:Jost; font-weight:500; font-size:26px; letter-spacing:.16em; color:var(--deep); }
.tag .pr { position:absolute; left:28px; top:70px; font-family:CG; font-weight:500; font-size:84px; line-height:1; color:var(--deep); font-feature-settings:"lnum" 1; }
.chip { position:absolute; height:66px; padding:0 28px 0 34px; background:rgba(251,243,236,.95); font-family:Jost; font-weight:500; font-size:30px;
      letter-spacing:.16em; line-height:66px; color:var(--deep); box-shadow:0 8px 20px rgba(26,22,20,.25); white-space:nowrap; }
.chip::before { content:''; position:absolute; left:0; top:0; bottom:0; width:7px; background:var(--blush); }
.card { position:absolute; background:var(--ivory); box-shadow:0 20px 44px rgba(26,22,20,.34), 0 3px 8px rgba(26,22,20,.2); }
.card::after { content:''; position:absolute; inset:12px; border:2px solid var(--blush); pointer-events:none; }
.loupe { position:absolute; border-radius:50%; overflow:hidden; background:#000; box-shadow:0 0 0 5px var(--ivory), 0 0 0 8px var(--blush), 0 16px 34px rgba(26,22,20,.45); }
.loupe img { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:0 0; }
.sticker { position:absolute; border-radius:50%; background:var(--blush); display:flex; flex-direction:column; align-items:center; justify-content:center;
      box-shadow:0 10px 24px rgba(26,22,20,.3); color:var(--deep); }
.photo { position:absolute; width:392px; height:520px; background:var(--ivory); box-shadow:0 24px 50px rgba(26,22,20,.42), 0 3px 8px rgba(26,22,20,.25); }
.photo .ph { position:absolute; left:18px; top:18px; width:356px; height:430px; overflow:hidden; background:#000; }
.photo .ph img { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:0 0; }
.photo .cap { position:absolute; left:20px; right:20px; bottom:20px; font-family:Jost; font-weight:500; font-size:20px; letter-spacing:.2em; color:var(--deep); display:flex; justify-content:space-between; }
#flash { position:absolute; inset:0; background:var(--ivory); opacity:0; pointer-events:none; }
#iris { position:absolute; inset:0; pointer-events:none; }
#end { position:absolute; inset:0; display:none; background:
  radial-gradient(95% 55% at 50% 102%, rgba(255,189,168,.62), rgba(255,189,168,.14) 58%, rgba(251,243,236,0) 78%), var(--ivory); }
#end .btn { position:absolute; background:var(--deep); color:var(--ivory); font-family:Jost; font-weight:500; letter-spacing:.2em; text-align:center; }
#measure { position:absolute; left:0; top:0; visibility:hidden; white-space:nowrap; }
/* price line, as the product page shows it: the price, the MRP struck through, the saving */
.prow { display:flex; align-items:baseline; gap:16px; white-space:nowrap; }
.prow .p { font-family:CG; font-style:italic; font-weight:500; color:var(--deep); font-feature-settings:"lnum" 1; line-height:1; }
.prow .m { font-family:Jost; font-weight:400; color:rgba(80,114,106,.6); text-decoration:line-through; text-decoration-thickness:2px; }
.prow .o { font-family:Jost; font-weight:600; letter-spacing:.12em; color:var(--deep); background:var(--blush); padding:3px 10px 3px 12px; }
.tag .pw { position:absolute; left:28px; top:66px; }
.tag .u { position:absolute; left:30px; top:158px; font-family:CG; font-style:italic; font-weight:500; font-size:32px; color:var(--deep); }
/* posts: Instagram's own "background" text style, per-line boxes, in the brand's ivory and blush */
.nc { position:absolute; left:40px; width:1000px; text-align:center; will-change:transform,opacity; }
.nc span { display:inline; font-family:Jost, 'Noto Color Emoji'; font-weight:500; color:var(--ink); background:var(--ivory); line-height:1.46;
      padding:.06em .36em .1em; border-radius:.26em; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
.nc.bl span { background:var(--blush); }
/* posts: chat bubbles (Mummy on the left in ivory, me on the right in blush) */
.bub { position:absolute; max-width:800px; will-change:transform,opacity; }
.bub .who { display:block; font-family:Jost, 'Noto Color Emoji'; font-weight:600; font-size:27px; letter-spacing:.03em; color:var(--deep); margin:0 0 6px; text-align:left; }
.bub .msg { display:inline-block; text-align:left; font-family:Jost, 'Noto Color Emoji'; font-weight:500; font-size:45px; line-height:1.24; color:var(--ink); background:var(--ivory);
      padding:22px 34px 24px; border-radius:40px 40px 40px 10px; box-shadow:0 12px 28px rgba(26,22,20,.32); }
.bub.me { text-align:right; }
.bub.me .msg { background:var(--blush); border-radius:40px 40px 10px 40px; }
.hnd { position:absolute; left:0; width:1080px; text-align:center; font-family:Jost; font-weight:500; font-size:24px; letter-spacing:.12em; color:var(--ivory);
      filter:drop-shadow(0 1px 4px rgba(26,22,20,.75)); }
</style></head>
<body><div id="stage">
  <div id="vid"></div>
  <div id="behind"></div>
  <div id="fg"></div>
  <svg id="ov" viewBox="0 0 1080 1920"></svg>
  <div id="ui"></div>
  <div id="end"></div>
  <div id="flash"></div>
  <svg id="iris" class="abs" width="1080" height="1920"></svg>
</div>
<span id="measure"></span>
<script>
const D = window.D, FPS = D.fps, C = D.cues, V = D.version;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = { lin: p => p, out: p => 1 - (1 - p) ** 3, io: p => p < .5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2, out5: p => 1 - (1 - p) ** 5,
  back: p => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * (p - 1) ** 3 + c1 * (p - 1) ** 2; } };
const P = (t, t0, d, e = 'out') => E[e](clamp((t - t0) / d));
const win = (t, a, b, fi = .2, fo = .2) => (t < a || t > b) ? 0 : P(t, a, fi) * (1 - P(t, b - fo, fo, 'io'));
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const sv = (tag, at = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; };
const el = (cls, html = '', parent = $('ui'), st = {}) => { const e = document.createElement('div'); if (cls) e.className = cls; e.innerHTML = html; Object.assign(e.style, st); parent.appendChild(e); return e; };
const f1 = v => (+v).toFixed(1);
const pad4 = n => String(n).padStart(4, '0');
const show = (e, on, disp = '') => { e.style.display = on ? disp : 'none'; };
function setImg(img, src) { if (img.getAttribute('src') !== src) img.setAttribute('src', src); }
const cf = f => clamp(Math.round(f), 1, D.nSrc);
const frameSrc = f => D.frames + pad4(cf(f)) + '.png';
const matteSrc = f => D.matte + pad4(cf(f)) + '.png';
const srcFrameAt = s => Math.round(s * FPS) + 1;
const face = f => D.faces[String(cf(f))];
// the hoop track exists only where the hoop is in view; [x, y, diameter, a] where a fades to 0 at an occlusion
const hoopAt = f => D.hoop[String(cf(f))] || null;
const hoopR = f => { const h = hoopAt(f); return h ? h[2] / 2 : .1 * face(f)[2]; };
const inWin = (t, ws) => (ws || []).some(w => t >= w[0] && t < w[1]);

// ---------- camera ----------
function segAt(t) { let s = D.edl[0]; for (const e of D.edl) if (t >= e.t0 - 1e-6) s = e; return s; }
function frameOf(e, t) {
  if (e.kind === 'freeze') return e.f;
  if (e.kind === 'stut') { const d = t - e.t0, k = Math.floor(d / e.slot), u = d - k * e.slot; return srcFrameAt(e.s0 + k * e.step + u); }
  return srcFrameAt(e.s0 + (t - e.t0));
}
const anchorCache = new Map();
function anchorOf(e) {                                   // a segment zooms about the mean face centre of its frames
  if (anchorCache.has(e)) return anchorCache.get(e);
  const fs = []; if (e.kind === 'freeze') fs.push(e.f); else for (let t = e.t0; t < Math.min(e.t1, D.dur); t += .1) fs.push(frameOf(e, t));
  let x = 0, y = 0; for (const f of fs) { const fc = face(f); x += fc[0] + fc[2] / 2; y += fc[1] + fc[3] * .62; }
  const a = [x / fs.length, y / fs.length]; anchorCache.set(e, a); return a;
}
// one full-frame shot at time t: which source frame, and where it sits on screen
function camAt(t) {
  const e = segAt(t); if (e.kind === 'split' || e.kind === 'merge' || e.kind === 'tri') return null;
  const f = cf(frameOf(e, t)), [ax, ay] = anchorOf(e);
  let z = lerp(e.z0, e.z1, E.io(clamp((t - e.t0) / Math.max(.01, e.t1 - e.t0))));
  if (D.pulse && t >= D.pulse[0] && t < D.pulse[1]) {                 // a 2.5% kick on every beat
    let lb = -1; for (const g of D.grid) if (g <= t) lb = g; if (lb >= 0) z *= 1 + .025 * (1 - E.out(clamp((t - lb) / .22)));
  }
  let tx = 0, ty = 0; if (z > 1) { tx = clamp(ax - ax * z, 1080 - 1080 * z, 0); ty = clamp(ay - ay * z, 1920 - 1920 * z, 0); }
  return { e, f, z, tx, ty };
}
// every face on screen at time t (one per panel), as [x0, y0, x1, y1, clipX0, clipX1]; head=true widens it to her hair
function faceBoxes(t, head = false) {
  const e = segAt(t), out = [];
  const box = (f, z, tx, ty, c0 = 0, c1 = 1080) => { const fc = face(f);
    const x0 = head ? fc[0] - .3 * fc[2] : fc[0], x1 = head ? fc[0] + 1.3 * fc[2] : fc[0] + fc[2], y0 = head ? fc[1] - .55 * fc[3] : fc[1], y1 = fc[1] + fc[3];
    out.push([Math.max(c0, tx + z * x0), ty + z * y0, Math.min(c1, tx + z * x1), ty + z * y1]); };
  if (e.kind === 'tri') { for (let i = 0; i < 3; i++) { const g = triGeom(e, t, i); box(g.f, 1, g.x, 0, i * 360, (i + 1) * 360); } }
  else if (e.kind === 'split' || e.kind === 'merge') { for (const g of splitGeom(e, t)) box(g.f, 1, g.x, 0, g.c0, g.c1); }
  else { const c = camAt(t); box(c.f, c.z, c.tx, c.ty); }
  return out;
}
// 1 when nothing of her is under the box over the next/last quarter second, easing to 0 as her head arrives
function duck(b, t) {
  let m = 0; const area = (b[2] - b[0]) * (b[3] - b[1]);
  for (let k = -3; k <= 3; k++) for (const h of faceBoxes(clamp(t + k * .08, 0, D.dur - .001), true)) {
    const ix = Math.min(b[2], h[2]) - Math.max(b[0], h[0]), iy = Math.min(b[3], h[3]) - Math.max(b[1], h[1]);
    if (ix > 0 && iy > 0) m = Math.max(m, ix * iy / area); }
  return 1 - E.io(clamp(m / .12));
}

// ---------- video: panels, each with a matte-cut copy of her (for type behind her) ----------
const VID = $('vid'), FG = $('fg');
function mkPanel(withFG) {
  const p = document.createElement('div'); p.className = 'panel'; const im = document.createElement('img'); p.appendChild(im); VID.appendChild(p);
  let fg = null;
  if (withFG) { const fp = document.createElement('div'); fp.className = 'panel'; const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1920; fp.appendChild(cv); FG.appendChild(fp);
    fg = { p: fp, cv, ctx: cv.getContext('2d'), mt: new Image() }; }
  return { p, im, fg, tx: 0, ty: 0, z: 1, f: 1, on: false };
}
const PA = mkPanel(true), PB = mkPanel(true), PC = mkPanel(false);
const PANELS = [PA, PB, PC];
function place(pn, f, z, tx, ty) {
  setImg(pn.im, frameSrc(f)); pn.f = cf(f); pn.on = true; pn.p.style.display = '';
  pn.tx = tx; pn.ty = ty; pn.z = z;
  const tr = `translate(${f1(tx)}px, ${f1(ty)}px) scale(${z.toFixed(5)})`;
  pn.im.style.transform = tr;
  if (pn.fg) { pn.fg.cv.style.transform = tr; setImg(pn.fg.mt, matteSrc(pn.f)); }
}
const toS = (pn, x, y) => [pn.tx + pn.z * x, pn.ty + pn.z * y];
let CUR = { main: PA, seg: null, f: 1, left: null };
function clip(pn, c) { pn.p.style.clipPath = c; if (pn.fg) pn.fg.p.style.clipPath = c; }
function splitGeom(e, t) {
  if (e.kind === 'split') return [{ f: srcFrameAt(e.left + (t - e.t0)), x: 270 - e.cxl, c0: 0, c1: 540 }, { f: srcFrameAt(e.right + (t - e.t0)), x: 810 - e.cxr, c0: 540, c1: 1080 }];
  const p = E.io(clamp((t - e.t0) / e.mdur)), sp = D.edl.find(x => x.kind === 'split');
  const g = [];
  if (p < 1) g.push({ f: srcFrameAt(sp.left + (e.t0 - sp.t0) + Math.min(t - e.t0, e.mdur)), x: 270 - sp.cxl - 560 * p, c0: 0, c1: 540 - 540 * p });
  g.push({ f: srcFrameAt(e.right + (t - e.t0)), x: (810 - e.cxr) * (1 - p), c0: 540 * (1 - p), c1: 1080 });
  return g;
}
function triGeom(e, t, i) {
  const f = srcFrameAt(e.s0 + Math.max(0, t - e.t0 - e.lag[i])), fc = face(f), cx = fc[0] + fc[2] / 2;
  const slide = (1 - E.out5(clamp((t - e.t0) / .35))) * (i - 1) * 260;
  return { f, x: 180 + i * 360 - cx + slide };
}
function drawVideo(t) {
  const e = segAt(t); CUR.seg = e; CUR.left = null;
  for (const pn of PANELS) { pn.on = false; pn.p.style.display = 'none'; clip(pn, 'none'); }
  if (e.kind === 'split' || e.kind === 'merge') {
    const g = splitGeom(e, t), R = g[g.length - 1];
    place(PB, R.f, 1, R.x, 0); clip(PB, `inset(0 0 0 ${f1(R.c0)}px)`); CUR.main = PB;
    if (g.length > 1) { place(PA, g[0].f, 1, g[0].x, 0); clip(PA, `inset(0 ${f1(1080 - g[0].c1)}px 0 0)`); CUR.left = PA; }
  } else if (e.kind === 'tri') {
    [PA, PB, PC].forEach((pn, i) => { const g = triGeom(e, t, i); place(pn, g.f, 1, g.x, 0);
      clip(pn, `inset(0 ${1080 - (i + 1) * 360 + (i < 2 ? 3 : 0)}px 0 ${i * 360 + (i > 0 ? 3 : 0)}px)`); });
    CUR.main = PB;
  } else { const c = camAt(t); place(PA, c.f, c.z, c.tx, c.ty); CUR.main = PA; }
  CUR.f = CUR.main.f;
  // depth: her matte-cut copy goes on top only while something sits behind her
  const depth = inWin(t, D.depth) && e.kind !== 'tri';
  FG.style.display = depth ? '' : 'none'; $('behind').style.display = depth ? '' : 'none';
  for (const pn of [PA, PB]) if (pn.fg) pn.fg.p.style.display = depth && pn.on ? '' : 'none';
}
// compose her cut-out for every visible matte panel once both the frame and its matte have decoded
async function composeFG() {
  for (const pn of [PA, PB]) {
    if (!pn.fg || !pn.on || FG.style.display === 'none') continue;
    try { await pn.im.decode(); await pn.fg.mt.decode(); } catch (e) {}
    const c = pn.fg.ctx; c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, 1080, 1920);
    c.drawImage(pn.im, 0, 0, 1080, 1920); c.globalCompositeOperation = 'destination-in'; c.drawImage(pn.fg.mt, 0, 0, 1080, 1920);
    c.globalCompositeOperation = 'source-over';
  }
}

// ---------- fitting giant type to the frame (after the fonts are in) ----------
const FITS = [];
function fitLater(e, maxW, maxPx) { FITS.push(() => {
  const m = $('measure'); m.className = e.className; m.style.cssText = 'position:absolute;left:0;top:0;width:auto;visibility:hidden;white-space:nowrap;font-size:' + maxPx + 'px';
  m.innerHTML = e.innerHTML; const w = m.getBoundingClientRect().width; m.innerHTML = '';
  e.style.fontSize = (w > maxW ? maxPx * maxW / w : maxPx).toFixed(1) + 'px'; e.dataset.px = e.style.fontSize; }); }

// ---------- brand marks ----------
const FL = D.marks.flower, WM = D.marks.wordmark;
function makeLogo(parent, width, letterFill = '#99B4AF', flowerFill = '#FFBDA8', shadow = false) {
  const h = width * WM.h / WM.w; const s = sv('svg', { width, height: h, viewBox: `0 0 ${WM.w} ${WM.h}`, class: 'abs', style: 'overflow:visible' + (shadow ? ';filter:drop-shadow(0 2px 8px rgba(26,22,20,.35))' : '') }, parent);
  for (const L of WM.letters) sv('path', { d: L.d, fill: letterFill }, s);
  const g = sv('g', { transform: `translate(${FL.left} ${FL.top}) scale(${FL.scale})` }, s); sv('path', { d: FL.d, fill: flowerFill }, g);
  return { s, h };
}
function logoDiv(width, x, y, opts = {}) {
  const d = el('', '', opts.parent || $('ui'), { position: 'absolute', left: x + 'px', top: y + 'px', width: width + 'px' });
  const L = makeLogo(d, width, opts.letter, opts.flower, opts.shadow); d.style.height = L.h + 'px'; return d;
}
// the corner bug: top left, where her head goes least (measured: hidden 13-30% of the time there, 54-74% top centre);
// it steps aside (fades) whenever her head is about to pass under it
function mkBug(w = 200, x = 64, y = 272, letter = '#6E918A') { const d = logoDiv(w, x, y, { letter }); const h = w * WM.h / WM.w;
  return { d, box: [x - 10, y - 8, x + w + 10, y + h + 8] }; }
function drawBug(B, t, extra = 1) { B.d.style.opacity = (duck(B.box, t) * extra).toFixed(3); }

// ---------- components ----------
// product tag: the name and the price line, and the address where a card has to carry it
const priceRow = (p = 76, m = 30, o = 22) => `<div class="prow"><span class="p" style="font-size:${p}px">${D.product.price}</span><span class="m" style="font-size:${m}px">${D.product.mrp}</span><span class="o" style="font-size:${o}px">${D.product.off}% OFF</span></div>`;
function mkTag(x, y, parent = $('ui'), url = false) {
  return el('tag', `<div class="nm">${D.product.name}</div><div class="pw">${priceRow()}</div>${url ? '<div class="u">nairaflore.com</div>' : ''}`, parent,
    { left: x + 'px', top: y + 'px', width: '520px', height: (url ? 212 : 176) + 'px' });
}
function drawTagAt(e, t, t0, t1, from = 'up') {
  const on = t >= t0 && t < t1; show(e, on); if (!on) return 0;
  const p = E.out5(clamp((t - t0) / .55)), o = P(t, t1 - .25, .25, 'io');
  e.style.opacity = (clamp((t - t0) / .25) * (1 - o)).toFixed(3);
  e.style.transform = from === 'left' ? `translateX(${f1((1 - p) * -60)}px)` : `translateY(${f1((1 - p) * 28)}px)`;
  return clamp((t - t0) / .25) * (1 - o);
}
