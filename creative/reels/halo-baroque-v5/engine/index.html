<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: CG; src: url('../../fonts/CG.ttf'); font-weight: 300 700; }

:root { --ivory:#FBF3EC; --ink:#1A1614; --blush:#FFBDA8; --sage:#99B4AF; --sage-deep:#50726A; }
html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#FBF3EC; }
.abs { position:absolute; left:0; top:0; }

  radial-gradient(90% 55% at 50% 100%, rgba(255,189,168,.55), rgba(255,189,168,.12) 55%, rgba(251,243,236,0) 75%), var(--ivory); }

  radial-gradient(90% 55% at 50% 100%, rgba(255,189,168,.55), rgba(255,189,168,.12) 55%, rgba(251,243,236,0) 75%), var(--ivory); }
#backTint { position:absolute; inset:0; background:
  radial-gradient(90% 60% at 50% 100%, rgba(255,189,168,.55), rgba(255,189,168,.18) 60%, rgba(255,230,220,.25)), #FCEFE8; }

/* captions: Cormorant italic, lowercase, words rise in as they are spoken */
#cap { position:absolute; left:65px; width:950px; top:1150px; text-align:center; white-space:nowrap; font-family:CG; font-style:italic; font-weight:500;
       font-size:68px; line-height:1; color:var(--ivory); }
#cap .cw { display:inline-block; position:relative; margin:0 .11em; filter:drop-shadow(0 2px 10px rgba(26,22,20,.65)) drop-shadow(0 1px 2px rgba(26,22,20,.6)); }
#cap .cw u { position:absolute; left:2%; right:2%; bottom:-.06em; height:3px; background:var(--blush); transform-origin:0 50%; transform:scaleX(0); text-decoration:none; }
#capScrim { position:absolute; left:0; width:1080px; top:1060px; height:260px;
       background:radial-gradient(60% 50% at 50% 55%, rgba(26,22,20,.30), rgba(26,22,20,.10) 60%, rgba(26,22,20,0)); }
/* DM bubbles */
.bub { position:absolute; padding:24px 34px 26px; border-radius:38px; font-family:Jost; font-weight:450; font-size:40px; line-height:1.15; white-space:nowrap;
       box-shadow:0 14px 34px rgba(26,22,20,.28), 0 2px 6px rgba(26,22,20,.18); transform-origin:0% 100%; will-change:transform,opacity; }

.bub.out { background:var(--sage-deep); color:var(--ivory); border-bottom-right-radius:10px; transform-origin:100% 100%; }

.bub.out .who { color:rgba(251,243,236,.75); }

       filter:drop-shadow(0 1px 4px rgba(26,22,20,.7)); }
.badge { position:absolute; width:132px; height:132px; border-radius:50%; background:var(--blush); color:var(--sage-deep); display:flex; align-items:center;
       justify-content:center; font-family:CG; font-style:italic; font-weight:600; font-size:72px; box-shadow:0 8px 20px rgba(26,22,20,.3); }
/* product tag: the brand's sharp corners, ivory card, blush hairline */
.tag { position:absolute; width:450px; height:204px; background:var(--ivory); box-shadow:0 14px 30px rgba(26,22,20,.32), 0 2px 5px rgba(26,22,20,.2);
       transform-origin:50% 50%; will-change:transform,opacity; }
.tag::after { content:''; position:absolute; inset:10px; border:2px solid var(--blush); }
.tag .nm { position:absolute; left:34px; right:24px; top:32px; font-family:Jost; font-weight:500; font-size:30px; letter-spacing:.16em; line-height:1.22; color:var(--sage-deep); }
.tag .pr { position:absolute; left:32px; top:84px; font-family:CG; font-weight:500; font-size:90px; line-height:1; color:var(--sage-deep); font-feature-settings:"lnum" 1; }
.big { position:absolute; left:0; width:1080px; text-align:center; font-family:CG; font-style:italic; font-weight:500; color:var(--ivory);
       filter:drop-shadow(0 3px 16px rgba(26,22,20,.6)) drop-shadow(0 1px 3px rgba(26,22,20,.5)); white-space:nowrap; }
.lbl { font-family:CG; font-style:italic; font-weight:600; fill:var(--ivory); stroke:rgba(26,22,20,.42); stroke-width:7px; paint-order:stroke; stroke-linejoin:round; }
/* pearl loupe and slider panel */
#disc { position:absolute; border-radius:50%; overflow:hidden; background:var(--ivory); box-shadow:0 18px 40px rgba(26,22,20,.35); }

#bprice { position:absolute; left:0; width:362px; top:426px; text-align:center; font-family:CG; font-style:italic; font-weight:500; font-size:52px; line-height:1.15; white-space:normal; color:var(--sage-deep); white-space:nowrap; }

       font-size:19px; letter-spacing:.2em; color:var(--sage-deep); white-space:nowrap; }
/* end card */
#end { position:absolute; inset:0; display:none; }
.prod { position:absolute; will-change:transform; filter:drop-shadow(0 16px 22px rgba(26,22,20,.22)); }
.shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, rgba(80,114,106,.32), rgba(80,114,106,0)); }

.odo > span { display:block; will-change:transform; }
.odo > span > i { display:block; font-style:italic; height:1.02em; line-height:1.02em; }
.rs { font-size:1.16em; line-height:0; }
.cm { margin-left:-.03em; margin-right:-.07em; }
.was { position:relative; display:inline-block; font-size:.62em; color:var(--sage); margin-right:.35em; font-feature-settings:"lnum" 1; }
.was b { position:absolute; left:-4%; right:-4%; top:52%; height:3px; background:var(--blush); transform-origin:0 50%; transform:scaleX(0); }
#url { position:absolute; left:0; width:1080px; text-align:center; font-family:CG; font-style:italic; font-weight:500; font-size:66px; color:var(--sage-deep); }
#uline { position:absolute; height:2px; background:var(--blush); transform-origin:0 50%; }

  <svg id="petB" class="abs" width="1080" height="1920" style="overflow:visible"></svg>
  <div id="persp"><div id="card">
    <div class="face" id="front">
      <div id="world"><img id="vid"><img id="vid2" style="position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0"><svg id="wsvg" viewBox="0 0 1080 1920"></svg></div>

</div>
<script>
const D = window.D, FPS = D.fps, C = D.cue, X = D.exit, B = .6375;
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const lerp = (a, c, p) => a + (c - a) * p;
const E = {
  lin: t => t, io: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2, out: t => 1 - Math.pow(1 - t, 3),
  out5: t => 1 - Math.pow(1 - t, 5), expo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t), in: t => t * t * t,
  back: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },

const P = (t, t0, dur, ease = 'out') => E[ease](clamp((t - t0) / dur));

const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs = {}, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const div = (cls, html = '', parent = $('text')) => { const e = document.createElement('div'); if (cls) e.className = cls; e.innerHTML = html; parent.appendChild(e); return e; };
const pad = (n, w) => String(n).padStart(w, '0');
const f1 = v => v.toFixed(1);

// ---------- the edit: output time -> segment, source frame, zoom ----------
function segAt(t) { let s = D.edl[0]; for (const e of D.edl) if (t >= e.t0 - 1e-6) s = e; return s; }
const DUP = new Set(D.dups), CUTSET = new Set(D.srcCuts);
const UNIQ = []; for (let f = 1; f <= D.nSrc; f++) if (!DUP.has(f)) UNIQ.push(f);       // the capture repeats a frame every 10; skip those
function srcPos(e, t) {                  // fractional position among the real frames for this output time
  const s = Math.max(0, e.s0 + (t - e.t0) * e.sp), fr = s * FPS + 1;
  let lo = 0, hi = UNIQ.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (UNIQ[m] <= fr) lo = m; else hi = m; }
  const a = UNIQ[lo], b = UNIQ[hi]; const u = b > a ? clamp((fr - a) / (b - a)) : 0;
  return { a, b, u };
}
const srcFrame = (e, t) => { const p = srcPos(e, t); return p.u < .5 ? p.a : p.b; };
const ringAt = f => D.ring[String(f)] || null;          // [cx, cy, tigerX, tigerY, crystalX, crystalY] in source pixels

// ---------- glint ----------
const W = $('wsvg'), defs = sv('defs', {}, W);
defs.innerHTML = `<radialGradient id="bloom"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#FFF4EE" stop-opacity=".45"/><stop offset="1" stop-color="#FFF4EE" stop-opacity="0"/></radialGradient>
 <radialGradient id="streak"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".22" stop-color="#FFF3EE" stop-opacity=".75"/><stop offset="1" stop-color="#FFE6DC" stop-opacity="0"/></radialGradient>`;
function mkGlint(parent) {
  const g = sv('g', {}, parent);
  sv('circle', { r: 46, fill: 'url(#bloom)' }, g);
  sv('ellipse', { rx: 150, ry: 4, fill: 'url(#streak)' }, g);
  sv('path', { d: 'M0,-60 C4,-9 9,-4 60,0 C9,4 4,9 0,60 C-4,9 -9,4 -60,0 C-9,-4 -4,-9 0,-60Z', fill: '#fff' }, g);
  g.style.display = 'none'; return g;
}
function drawGlint(g, t, at, x, y, s = 1, dur = .5) {
  const d = t - at;
  if (d < 0 || d > dur || x == null) { g.style.display = 'none'; return; }
  const p = d / dur, k = s * Math.sin(Math.PI * p) * (.6 + .4 * E.out(p));
  g.style.display = ''; g.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) rotate(${f1(lerp(-15, 25, p))}) scale(${k.toFixed(3)})`);
}
// ---------- captions ----------
const CAP = $('cap');
const capEls = D.caps.map(c => {
  const box = document.createElement('div'); box.style.display = 'none';
  c.ws = c.words.map(w => { const s = document.createElement('span'); s.className = 'cw'; s.innerHTML = w.w + (w.k ? '<u></u>' : ''); box.appendChild(s); return { el: s, u: s.querySelector('u'), ...w }; });
  CAP.appendChild(box); return { c, box };
});
function drawCaptions(t) {
  const on = t < X.shrink;
  $('capScrim').style.opacity = on ? 1 : 0;
  for (const { c, box } of capEls) {
    const vis = on && t >= c.t0 && t < c.t1;
    box.style.display = vis ? '' : 'none'; if (!vis) continue;
    const out = 1 - P(t, c.t1 - .1, .1);
    for (const w of c.ws) {
      const d = t - w.t + .06, p = E.out(clamp(d / .2));
      w.el.style.opacity = (clamp(d / .1) * out).toFixed(3);
      w.el.style.transform = `translateY(${f1((1 - p) * 16)}px)`;
      if (w.u) w.u.style.transform = `scaleX(${E.io(clamp((d - .08) / .3)).toFixed(3)})`;   // key words are underlined in blush as they land
    }
  }
}

// ---------- hook: the two DMs she got ----------
const typing = '<span class="dots"><i></i><i></i><i></i></span>';
function mkBubble(cls, who, text, x, y, right = false) {
  const b = div('bub ' + cls, `<span class="who">${who}</span><span class="tx">${text}</span><span class="ty">${typing}</span>`);
  b.style.top = y + 'px'; if (right) b.style.right = x + 'px'; else b.style.left = x + 'px';
  return { b, tx: b.querySelector('.tx'), ty: b.querySelector('.ty'), dots: [...b.querySelectorAll('.dots i')] };
}
const BUB = [
  { ...mkBubble('in', 'new message', 'where is this from?', 80, 282), t0: -.2, tt: C.asked + .1, t1: C.so + .55 },   // already arriving on frame 1: the hook needs a graphic up front
  { ...mkBubble('in', 'new message', 'okay but where is it from??', 80, 432), t0: C.twice - .15, tt: C.twice + .2, t1: C.so + .62 },
  { ...mkBubble('in', 'new message', 'where is this from?', 80, 330), t0: C.someone2 - .25, tt: C.someone2 + .12, t1: 99 },
  { ...mkBubble('out', 'you', 'nairaflore.com', 80, 520, true), t0: C.you_know - .3, tt: C.you_know - .12, t1: 99, seen: true },
];
BUB[3].b.insertAdjacentHTML('beforeend', '<span class="seen">sent</span>');
const badge = div('badge', '×2'); badge.style.visibility = 'hidden'; badge.style.left = '842px'; badge.style.top = '296px';
function drawBubbles(t) {
  for (const B_ of BUB) {
    const d = t - B_.t0, vis = d >= 0 && t < B_.t1 + .3;
    B_.b.style.display = vis ? '' : 'none'; if (!vis) continue;
    const pin = E.back(clamp(d / .3)), out = P(t, B_.t1, .3, 'io');
    B_.b.style.opacity = (clamp(d / .1) * (1 - out)).toFixed(3);
    B_.b.style.transform = `translateY(${f1(-out * 70)}px) scale(${lerp(.55, 1, pin).toFixed(3)})`;
    const typed = t >= B_.tt;                       // a beat of typing dots, then the words
    B_.tx.style.display = typed ? '' : 'none'; B_.ty.style.display = typed ? 'none' : '';
    B_.dots.forEach((e, i) => e.style.transform = `translateY(${f1(-6 * Math.max(0, Math.sin((t * 9) - i * .9)))}px)`);
  }
  const bd = t - C.week;
  badge.style.display = bd >= 0 && t < C.so + .9 ? '' : 'none';
  badge.style.opacity = (clamp(bd / .08) * (1 - P(t, C.so + .6, .3))).toFixed(3);
  badge.style.transform = `scale(${lerp(.85, 1, E.out(clamp(bd / .35))).toFixed(3)})`;
}

// ---------- the ring: labels on the real stones, a level line across their tops, the mismatch ----------
const gl = { s1: mkGlint(W), s4: mkGlint(W), pearl: null };
const LB = sv('g', { style: 'filter:drop-shadow(0 2px 6px rgba(26,22,20,.6))' }, W);
function mkCallout(lines, anchorRight) {
  const g = sv('g', { opacity: 0 }, LB);
  const dot = sv('circle', { r: 7, fill: '#FBF3EC' }, g);
  const ln = sv('path', { fill: 'none', stroke: '#FBF3EC', 'stroke-width': 3.4, pathLength: 100, 'stroke-dasharray': '100 100' }, g);
  const tx = sv('text', { class: 'lbl', 'font-size': 50, 'text-anchor': anchorRight ? 'end' : 'start' }, g);
  lines.forEach((l, i) => { const s = sv('tspan', { x: 0, dy: i ? 54 : 0 }, tx); s.textContent = l; });
  return { g, dot, ln, tx, n: lines.length, right: anchorRight };
}
const calT = mkCallout(['tiger eye'], false), calC = mkCallout(['champagne', 'crystal'], false);
const level = sv('g', { opacity: 0 }, LB);
const levLine = sv('line', { stroke: '#FFBDA8', 'stroke-width': 5, 'stroke-linecap': 'round' }, level);
const levT1 = sv('line', { stroke: '#FFBDA8', 'stroke-width': 4 }, level), levT2 = sv('line', { stroke: '#FFBDA8', 'stroke-width': 4 }, level);
const cirT = sv('circle', { fill: 'none', stroke: '#99B4AF', 'stroke-width': 5, pathLength: 100, 'stroke-dasharray': '100 100', opacity: 0 }, LB);
const cirC = sv('circle', { fill: 'none', stroke: '#FFBDA8', 'stroke-width': 5, pathLength: 100, 'stroke-dasharray': '100 100', opacity: 0 }, LB);
const purpose = div('big', 'on purpose.'); purpose.style.fontSize = '150px'; purpose.style.top = '360px';
const swash = sv('path', { d: 'M300,560 C420,585 640,585 780,548', fill: 'none', stroke: '#FFBDA8', 'stroke-width': 5, 'stroke-linecap': 'round', pathLength: 100, 'stroke-dasharray': '100 100' });
const swSvg = sv('svg', { width: 1080, height: 1920, class: 'abs', style: 'overflow:visible' }); swSvg.appendChild(swash); $('text').appendChild(swSvg);
function callout(c, t, t0, sx, sy, ex, ey, fade) {
  const d = t - t0;
  if (d < 0 || sx == null) { c.g.setAttribute('opacity', 0); return; }
  c.g.setAttribute('opacity', fade.toFixed(3));
  c.dot.setAttribute('cx', f1(sx)); c.dot.setAttribute('cy', f1(sy)); c.dot.setAttribute('r', (7 * E.back(clamp(d / .2))).toFixed(2));
  const hx = c.elbow ? c.elbow : ex + (c.right ? -70 : 70);
  c.ln.setAttribute('d', `M ${f1(sx)} ${f1(sy)} L ${f1(ex)} ${f1(ey)} L ${f1(hx)} ${f1(ey)}`);
  c.ln.setAttribute('stroke-dashoffset', (100 - 100 * E.io(clamp((d - .05) / .3))).toFixed(2));
  const pt = clamp((d - .25) / .25);
  c.tx.setAttribute('transform', `translate(${f1(hx + (c.right ? -12 : 12))} ${f1(ey - 18 - (c.n - 1) * 54 + (1 - E.out(pt)) * 14)})`);
  c.tx.setAttribute('opacity', pt.toFixed(3));
}
// the tag for the ring
function mkTag(name, price, x, y) { const e = div('tag', `<div class="nm">${name}</div><div class="pr">${price}</div>`); e.style.left = x + 'px'; e.style.top = y + 'px'; return e; }
const tagRing = mkTag('HALO CURVE RING', '₹2,049', 562, 300), tagLar = mkTag('BAROQUE PEARL<br>LARIAT', '₹1,599', 70, 290);
tagLar.style.height = '244px'; tagLar.querySelector('.pr').style.top = '122px';
function drawTag(e, t, t0, t1, fromRight) {
  const d = t - t0, vis = d >= 0 && t < t1;
  e.style.display = vis ? '' : 'none'; if (!vis) return;
  const p = E.out5(clamp(d / .6)), o = P(t, t1 - .3, .3, 'io');          // a quiet rise and settle
  e.style.opacity = (clamp(d / .35) * (1 - o)).toFixed(3);
  e.style.transform = `translateY(${f1((1 - p) * 26)}px)`;
}
// open at the back: a line drawing of this ring — the band open at the top, a stone on each end
