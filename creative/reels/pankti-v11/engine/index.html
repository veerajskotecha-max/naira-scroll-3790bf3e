<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: CG; src: url('../fonts/CG.ttf'); font-weight: 300 700; }
@font-face { font-family: CG; font-style: italic; src: url('../fonts/CG-Italic.ttf'); font-weight: 300 700; }
@font-face { font-family: Jost; src: url('../fonts/Jost.ttf'); font-weight: 100 900; }
:root { --ivory:#FBF3EC; --ink:#1A1614; --blush:#FFBDA8; --sage:#99B4AF; --sage-deep:#50726A; }
html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#FBF3EC; }
.abs { position:absolute; left:0; top:0; }
#stage { position:absolute; inset:0; overflow:hidden; background:var(--ivory); }
#bg { position:absolute; inset:0; background:
  radial-gradient(90% 55% at 50% 100%, rgba(255,189,168,.55), rgba(255,189,168,.12) 55%, rgba(251,243,236,0) 75%),
  var(--ivory); }
#persp { position:absolute; inset:0; perspective:2200px; perspective-origin:50% 45%; }
#card { position:absolute; inset:0; transform-style:preserve-3d; will-change:transform; }
.face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden; }
#front { background:var(--ivory); }
/* the back is the end card's own ground; its tint and hairline fade out as it grows, so the
   hand-off to the logo has no step in colour and no frame-border popping off */
#back { transform:rotateY(180deg); background:
  radial-gradient(90% 55% at 50% 100%, rgba(255,189,168,.55), rgba(255,189,168,.12) 55%, rgba(251,243,236,0) 75%), var(--ivory); }
#backTint { position:absolute; inset:0; background:
  radial-gradient(90% 60% at 50% 100%, rgba(255,189,168,.55), rgba(255,189,168,.18) 60%, rgba(255,230,220,.25)), #FCEFE8; }
#backBorder { position:absolute; inset:34px; border:2px solid rgba(153,180,175,.9); }
.glare { position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; }
#world { position:absolute; inset:0; transform-origin:50% 50%; will-change:transform; }
#vid, .pimg { position:absolute; display:block; }
#vid { left:0; top:0; width:1080px; height:1920px; }
.panel { position:absolute; top:0; width:540px; height:1920px; overflow:hidden; }
.pimg { top:0; height:1920px; }
#wsvg { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:visible; }
/* voice lines: Cormorant italic, ivory on picture */
.line { position:absolute; left:0; width:1080px; text-align:center; white-space:nowrap; }
.w { display:inline-block; font-family:CG; font-style:italic; font-weight:500; color:var(--ivory);
     filter:drop-shadow(0 3px 14px rgba(26,22,20,.55)) drop-shadow(0 1px 2px rgba(26,22,20,.45)); will-change:transform,opacity,filter; }
.sp { display:inline-block; }
.scrim { position:absolute; border-radius:50%; background:radial-gradient(closest-side, rgba(26,22,20,.38), rgba(26,22,20,.16) 60%, rgba(26,22,20,0)); }
/* swing tag: the brand's sharp corners, ivory card, blush hairline */
/* sized for a phone at arm's length: the name's caps are ~22px (they were 8pt on screen at 23px type) */
.tag { position:absolute; left:0; top:0; width:520px; height:232px; transform-origin:0 0; will-change:transform; }
.tag .card { position:absolute; left:0; top:0; width:520px; height:232px; background:var(--ivory);
     box-shadow:0 14px 30px rgba(26,22,20,.32), 0 2px 5px rgba(26,22,20,.2); }
.tag .card::after { content:''; position:absolute; inset:10px; border:2px solid var(--blush); }
.tag .hole { position:absolute; left:29px; top:99px; width:34px; height:34px; border-radius:50%; background:#d9cabd;
     box-shadow:inset 0 2px 4px rgba(26,22,20,.4); border:2px solid var(--blush); box-sizing:border-box; }
.tag .nm { position:absolute; left:92px; right:22px; top:34px; font-family:Jost; font-weight:500; font-size:32px;
     letter-spacing:.14em; color:var(--sage-deep); line-height:1.22; }
.tag .pr { position:absolute; left:88px; top:118px; font-family:CG; font-weight:500; font-size:92px; color:var(--sage-deep); line-height:1;
     font-feature-settings:"lnum" 1; }
/* weekday streak */
.day { position:absolute; width:86px; height:86px; border-radius:50%; box-sizing:border-box; border:2px solid rgba(251,243,236,.85);
     display:flex; align-items:center; justify-content:center; font-family:Jost; font-weight:500; font-size:33px; color:var(--ivory);
     filter:drop-shadow(0 2px 8px rgba(26,22,20,.45)); }
/* end card */
#end { position:absolute; inset:0; display:none; }
.prod { position:absolute; will-change:transform; filter:drop-shadow(0 16px 22px rgba(26,22,20,.22)); }
.shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, rgba(80,114,106,.32), rgba(80,114,106,0)); }
#price { position:absolute; left:0; width:1080px; text-align:center; font-family:CG; font-style:italic; font-weight:500; color:var(--sage-deep); white-space:nowrap; }
/* italic lining figures like the words around them; the padding keeps the italic overhang out of the clip */
.odo { display:inline-block; height:1.02em; overflow:hidden; vertical-align:bottom; font-feature-settings:"lnum" 1, "tnum" 1;
       padding:0 .06em; margin:0 -.08em 0 -.06em; }
.odo > span { display:block; will-change:transform; }
.odo > span > i { display:block; font-style:italic; height:1.02em; line-height:1.02em; }
.rs { font-size:1.16em; line-height:0; }      /* Cormorant's rupee is drawn at x-height; this brings it level with the figures */
.cm { margin-left:-.03em; margin-right:-.07em; }
#url { position:absolute; left:0; width:1080px; text-align:center; font-family:CG; font-style:italic; font-weight:500; font-size:66px; color:var(--sage-deep); }
#uline { position:absolute; height:2px; background:var(--blush); transform-origin:0 50%; }
</style></head>
<body><div id="stage">
  <div id="bg"></div>
  <svg id="wm" class="abs" style="overflow:visible"></svg>
  <svg id="petB" class="abs" width="1080" height="1920" style="overflow:visible"></svg>
  <div id="persp"><div id="card">
    <div class="face" id="front">
      <div id="world">
        <img id="vid">
        <div id="panels" style="display:none">
          <div class="panel" id="pL" style="left:0"><img class="pimg" id="pLi" style="width:540px"></div>
          <div class="panel" id="pR" style="left:540px"><img class="pimg" id="pRi" style="width:1080px"></div>
          <div class="abs" id="divider" style="left:537px;width:6px;height:1920px;background:#FBF3EC;transform-origin:50% 50%"></div>
        </div>
        <svg id="wsvg" viewBox="0 0 1080 1920"></svg>
        <div id="tags" class="abs"></div>
        <svg id="tsvg" class="abs" width="1080" height="1920" style="overflow:visible"></svg>
      </div>
      <div id="text" class="abs" style="width:1080px;height:1920px"></div>
      <div class="glare" id="glF"></div>
    </div>
    <div class="face" id="back"><div id="backTint"></div><div id="backBorder"></div><svg id="backFlower" class="abs" style="overflow:visible"></svg><div class="glare" id="glB"></div></div>
  </div></div>
  <div id="end">
    <svg id="logo" class="abs" style="overflow:visible"></svg>
    <div id="erule" class="abs" style="height:2px;background:#FFBDA8;transform-origin:50% 50%"></div>
    <div id="shH" class="shadow"></div><div id="shT" class="shadow"></div>
    <img id="prodH" class="prod"><img id="prodT" class="prod">
    <div id="price"></div>
    <div id="url"></div><div id="uline"></div>
  </div>
  <svg id="flyFlower" class="abs" style="overflow:visible;display:none"></svg>
  <svg id="petF" class="abs" width="1080" height="1920" style="overflow:visible"></svg>
</div>
<script>
const D = window.D, B = D.beat, FPS = D.fps, b = k => k * B;
// A cut lands on the frame the plate rounded it to, which can sit up to half a frame before
// the beat; anything that must end with a shot keys off this, or it hangs one frame into the next.
const bc = k => Math.round(b(k) * FPS) / FPS;
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const lerp = (a, c, p) => a + (c - a) * p;
const E = {
  lin: t => t,
  io: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  out5: t => 1 - Math.pow(1 - t, 5),
  expo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  in: t => t * t * t,
  back: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  quintIO: t => t < .5 ? 16*t*t*t*t*t : 1 - Math.pow(-2*t + 2, 5) / 2,
};
const P = (t, t0, dur, ease = 'out') => E[ease](clamp((t - t0) / dur));
const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs = {}, parent) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const pad = (n, w) => String(n).padStart(w, '0');

// ---------- tracks (plate coordinates, smoothed in Python) ----------
function trk(name, t) {
  const T = D.tracks[name]; if (!T) return null;
  const fr = t * FPS + 1, f0 = Math.floor(fr), a = fr - f0;
  const g = f => T[f] || T[String(f)];
  let p0 = g(f0), p1 = g(f0 + 1);
  if (!p0 && !p1) return null; if (!p0) p0 = p1; if (!p1) p1 = p0;
  return p0.map((v, i) => lerp(v, p1[i], a));
}

// ---------- shots and punch-ins ----------
const CUTS = D.cutBeats.map(bc);          // shot start times, on the plate's frames
function shotAt(t) { let k = 0; for (let i = 0; i < CUTS.length; i++) if (t >= CUTS[i] - 1e-6) k = i; return k; }

// ---------- glint (4-point star + bloom) ----------
function mkGlint(parent) {
  const g = sv('g', {}, parent);
  sv('circle', { r: 46, fill: 'url(#bloom)' }, g);
  sv('path', { d: 'M0,-72 C4,-10 10,-4 72,0 C10,4 4,10 0,72 C-4,10 -10,4 -72,0 C-10,-4 -4,-10 0,-72Z', fill: '#fff' }, g);
  sv('path', { d: 'M0,-30 C2,-4 4,-2 30,0 C4,2 2,4 0,30 C-2,4 -4,2 -30,0 C-4,-2 -2,-4 0,-30Z', fill: '#fff', transform: 'rotate(45)', opacity: .8 }, g);
  g.style.display = 'none'; return g;
}
function drawGlint(g, t, at, x, y, s = 1, dur = .55) {
  const d = t - at;
  if (d < 0 || d > dur || x == null) { g.style.display = 'none'; return; }
  const p = d / dur, k = s * Math.sin(Math.PI * p) * (.6 + .4 * E.out(p));
  g.style.display = ''; g.setAttribute('transform', `translate(${x} ${y}) rotate(${lerp(-20, 30, p)}) scale(${k})`);
}

const W = $('wsvg');
const defs = sv('defs', {}, W);
defs.innerHTML = `<radialGradient id="bloom"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#FFF4EE" stop-opacity=".45"/><stop offset="1" stop-color="#FFF4EE" stop-opacity="0"/></radialGradient>
 <radialGradient id="warm"><stop offset="0" stop-color="#FFE6DC" stop-opacity=".9"/><stop offset="1" stop-color="#FFBDA8" stop-opacity="0"/></radialGradient>`;

// ---------- kinetic type ----------
const TEXT = $('text');
function mkLine(words, y, size, opts = {}) {
  const L = document.createElement('div'); L.className = 'line'; L.style.top = y + 'px'; L.style.fontSize = size + 'px';
  if (opts.left !== undefined) { L.style.left = opts.left + 'px'; L.style.width = opts.width + 'px'; }
  const spans = words.map((w, i) => {
    const s = document.createElement('span'); s.className = 'w'; s.textContent = w.text; s.style.opacity = 0;
    if (w.color) s.style.color = w.color;
    if (w.cls) s.classList.add(w.cls);
    L.appendChild(s);
    if (i < words.length - 1) { const g = document.createElement('span'); g.className = 'sp'; g.innerHTML = '&nbsp;'; L.appendChild(g); }
    return { el: s, ...w };
  });
  TEXT.appendChild(L); return { L, spans, y, size, ...opts };
}
function wordIn(sp, t) {
  const d = sp.t <= 0 ? 1 : t - sp.t;       // the hook's first word is already set on frame 1
  if (d < 0) { sp.el.style.opacity = 0; return; }
  const pr = E.expo(clamp(d / .38)), pb = E.back(clamp(d / .42)), pf = clamp(d / .16);
  sp.el.style.opacity = pf;
  sp.el.style.transform = `translateY(${(1 - pr) * 34}px) scale(${lerp(1.12, 1, pb)})`;
  const blur = (1 - clamp(d / .2)) * 10;
  sp.el.style.filter = `blur(${blur.toFixed(2)}px) drop-shadow(0 3px 14px rgba(26,22,20,.55)) drop-shadow(0 1px 2px rgba(26,22,20,.45))`;
}
const lines = [];
function addLine(words, y, size, t0, t1, opts = {}) { const L = mkLine(words, y, size, opts); L.t0 = t0; L.t1 = t1; lines.push(L); return L; }

// hook: "not all gold" on the first three beats; light sweep through "gold"
const hook = addLine([{ text: 'not', t: 0 }, { text: 'all', t: b(1) }, { text: 'gold', t: b(2), cls: 'sweep' }], 1062, 140, 0, bc(4));   // the g's tail cleared 1248
const hookScrim = document.createElement('div'); hookScrim.className = 'scrim'; TEXT.insertBefore(hookScrim, TEXT.firstChild);
// "has to shine."
const shine = addLine([{ text: 'has', t: bc(4) }, { text: 'to', t: b(5) }, { text: 'shine.', t: b(6), cls: 'sweep' }], 330, 124, bc(4), bc(7));
// "satin, not mirror."
const satin = addLine([{ text: 'satin,', t: bc(10), cls: 'brush' }, { text: 'not', t: b(10.5) }, { text: 'mirror.', t: b(11), cls: 'mirror' }], 330, 118, bc(10), bc(13));
// "closes with a turn." — and "turn." turns, like the toggle does under her fingers
const turn = addLine([{ text: 'closes', t: bc(23) }, { text: 'with', t: b(24) }, { text: 'a', t: b(24.5) }, { text: 'turn.', t: b(25) }], 330, 112, bc(23), bc(30));
// "worn" | "together," — one word per panel
const worn = addLine([{ text: 'worn', t: bc(30) }], 560, 124, bc(30), bc(33), { left: 0, width: 540 });
const toge = addLine([{ text: 'together,', t: b(31) + .06, color: '#50726A' }], 560, 112, bc(30), bc(33), { left: 540, width: 540 });
toge.spans[0].el.style.filter = 'none';
// "every day."
const every = addLine([{ text: 'every', t: bc(33) }, { text: 'day.', t: b(34) }], D.every.y, 130, bc(33), bc(38));

// a slash through "mirror." (the reflection under it could not be seen at phone size, so it went)
const mirW = satin.spans[2].el;
mirW.style.position = 'relative';
const slash = document.createElementNS(SVGNS, 'svg'); slash.setAttribute('viewBox', '0 0 100 40');
slash.style.cssText = 'position:absolute;left:-6%;top:6%;width:112%;height:120%;overflow:visible';
slash.innerHTML = '<path d="M2,34 C30,24 62,14 98,4" fill="none" stroke="#FFBDA8" stroke-width="3.2" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100"/>';
mirW.appendChild(slash);

// weekday streak
const DAYS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
const dayEls = DAYS.map((d, i) => { const e = document.createElement('div'); e.className = 'day'; e.textContent = d;
  e.style.left = (540 - 3 * 104 - 43 + i * 104) + 'px'; e.style.top = D.every.py + 'px'; e.style.opacity = 0; TEXT.appendChild(e); return e; });
const dayT0 = b(33.5);      // the full week has to hold before the cut, not light on its last frames

// ---------- tracked graphics ----------
const gl = {}; ['hugL', 'hugR', 'ear1', 'ear3', 'r5a', 'r5b', 'r7a', 'r7b', 'panL', 'panR'].forEach(k => gl[k] = mkGlint(W));
// "shine." gets an optical streak, not drawn rays: a lens flare reads as light, rays read as clip-art
defs.insertAdjacentHTML('beforeend', '<radialGradient id="streak"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".22" stop-color="#FFF3EE" stop-opacity=".75"/><stop offset="1" stop-color="#FFE6DC" stop-opacity="0"/></radialGradient>');
const rays = sv('g', { opacity: 0 }, W);
sv('ellipse', { rx: 240, ry: 6, fill: 'url(#streak)' }, rays); sv('ellipse', { rx: 4, ry: 64, fill: 'url(#streak)', opacity: .55 }, rays);
const dust = [...Array(12)].map((_, i) => sv('circle', { r: 3, fill: '#fff', opacity: 0 }, W));
// the clasp dial: a bezel around her toggle, drawn by a blush comet that then clicks a quarter
// turn on each beat. It replaced orbiting type that was too small to read on a phone.
const dial = sv('g', { opacity: 0, style: 'filter:drop-shadow(0 1px 3px rgba(26,22,20,.5))' }, W);
const dRing = sv('circle', { fill: 'none', stroke: '#FBF3EC', 'stroke-width': 2.6, opacity: .78, pathLength: 100, 'stroke-dasharray': '100 100' }, dial);
const dTicks = [...Array(12)].map((_, j) => sv('line', { stroke: '#FBF3EC', 'stroke-width': j % 3 ? 2.6 : 4, 'stroke-linecap': 'butt', opacity: 0 }, dial));
const TAIL = 22, dTail = [...Array(TAIL)].map(() => sv('path', { fill: 'none', stroke: '#FFBDA8', 'stroke-linecap': 'butt' }, dial));
const dGlow = sv('circle', { r: 28, fill: 'url(#warm)' }, dial), dHead = sv('circle', { r: 9.5, fill: '#FBF3EC' }, dial);
const LAP0 = bc(23) + .04, LAP = b(24) - LAP0, STEPS = [25, 26, 27, 28, 29];   // the drawing lap closes on beat 24
// where the comet comes to rest: the lap ends at 12 o'clock, then each beat lands a quarter on
const LANDS = [[b(24), 0], ...STEPS.map((k, i) => [b(k), ((i + 1) * 3) % 12])];
function dialAngle(t) {           // clockwise from 12 o'clock: one drawing lap, then 90 degrees a beat
  let a = 2 * Math.PI * E.io(clamp((t - LAP0) / LAP));
  for (const k of STEPS) a += Math.PI / 2 * E.io(clamp((t - b(k) + .24) / .24));
  return a - Math.PI / 2;
}
// panel callouts
const cirL = sv('circle', { fill: 'none', stroke: '#FFBDA8', 'stroke-width': 3, 'stroke-linecap': 'round', pathLength: 100, 'stroke-dasharray': '100 100', 'stroke-dashoffset': 100, opacity: 0 }, W);
const cirR = sv('circle', { fill: 'none', stroke: '#FFBDA8', 'stroke-width': 3, 'stroke-linecap': 'round', pathLength: 100, 'stroke-dasharray': '100 100', 'stroke-dashoffset': 100, opacity: 0 }, W);

// swing tags (world coordinates, tethered to the tracked product)
// The thread is drawn ABOVE the card: it comes out of the eyelet, over the card's edge and down to a knot
// on the piece. Drawn underneath, it seemed to leave the card's bottom edge and the eyelet stayed empty.
const TS = $('tsvg');
const TAGS = D.tags.map(T => {
  const el = document.createElement('div'); el.className = 'tag'; el.style.opacity = 0;
  el.innerHTML = `<div class="card"></div><div class="hole"></div><div class="nm">${T.name}</div><div class="pr">${T.price}</div>`;
  $('tags').appendChild(el);
  const thr = sv('path', { fill: 'none', stroke: '#FBF3EC', 'stroke-width': 2.4, 'stroke-linecap': 'round', opacity: 0, pathLength: 100,
    'stroke-dasharray': '100 100', style: 'filter:drop-shadow(0 1px 2px rgba(26,22,20,.55))' }, TS);
  const knot = sv('g', { opacity: 0, style: 'filter:drop-shadow(0 1px 2px rgba(26,22,20,.5))' }, TS);
  sv('circle', { r: 8, fill: 'none', stroke: '#FBF3EC', 'stroke-width': 2.2 }, knot); sv('circle', { r: 3.4, fill: '#FBF3EC' }, knot);
  return { T, el, thr, knot };
});

// ---------- exit: petals, card, flower, logo ----------
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const PETAL = 'M0,-1 C0.62,-0.62 0.58,0.46 0,1 C-0.58,0.46 -0.62,-0.62 0,-1Z';
function mkPetals(svg, n, seed, front) {
  const r = rng(seed); const cols = ['#FFBDA8', '#FFBDA8', '#FFCDBC', '#FFD9CC', '#F7C9B6'];   // sage petals read as grey specks at this size
  return [...Array(n)].map(() => {
    const p = { x: r() * 1180 - 50, y: r() * 2300 - 300, v: 110 + r() * 130, amp: 16 + r() * 40, f: .25 + r() * .5, ph: r() * 6.28,
      rot: r() * 360, rv: (r() - .5) * 140, s: (front ? 16 : 13) + r() * (front ? 22 : 26), op: .45 + r() * .45, c: cols[Math.floor(r() * cols.length)] };
    p.el = sv('path', { d: PETAL, fill: p.c, opacity: 0 }, svg); return p;
  });
}
const petB = mkPetals($('petB'), 30, 7, false), petF = mkPetals($('petF'), 9, 11, true);
let CLEAR = null, clearK = 0;          // rectangles petals fade out of, and how much (0..1)
const outside = (x, y) => { if (!CLEAR || !clearK) return 1; let m = 1;
  for (const [x0, y0, x1, y1] of CLEAR) { const dx = Math.max(x0 - x, 0, x - x1), dy = Math.max(y0 - y, 0, y - y1); m = Math.min(m, clamp(Math.hypot(dx, dy) / 40)); }
  return lerp(1, m, clearK); };
function drawPetals(ps, t, t0, fade) {
  for (const p of ps) {
    if (t < t0) { p.el.setAttribute('opacity', 0); continue; }
    const d = t - t0; let y = p.y + p.v * d; y = ((y + 300) % 2300) - 300;
    const x = p.x + Math.sin(p.ph + d * p.f * 6.283) * p.amp;
    const sx = Math.cos(p.ph + d * 2.1) * .5 + .75;
    p.el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(p.rot + p.rv * d).toFixed(1)}) scale(${(p.s * sx).toFixed(2)} ${p.s.toFixed(2)})`);
    p.el.setAttribute('opacity', (p.op * fade * outside(x, y)).toFixed(3));
  }
}
const FL = D.marks.flower, WM = D.marks.wordmark;
function flowerSvg(svg, h, fill) {
  const w = h * FL.aspect; svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `0 0 ${FL.aspect} 1`); svg.innerHTML = `<path d="${FL.d}" fill="${fill}"/>`; return w;
}
const backFl = $('backFlower'); const BFH = 560; const BFW = flowerSvg(backFl, BFH, '#FFBDA8');
