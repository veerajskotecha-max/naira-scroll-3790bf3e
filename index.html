<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />
    <!-- Hero LCP image is bundled and marked fetchpriority="high" on the <img> itself. -->
    <!--
      The hero paper wash is the mobile LCP element. It is a CSS background, so
      the browser cannot discover it until the stylesheet has parsed and the
      element is laid out. Preloading here starts the fetch with the initial
      HTML. Vite rewrites this to the hashed build URL.
    -->
    <link rel="preload" as="image" href="/src/assets/floral-pattern-bg.webp" fetchpriority="high" />

    <!-- Preload Velista (self-hosted) so headings render with the brand font without blocking -->
    <link rel="preload" as="font" type="font/ttf" href="/fonts/Velista.ttf" crossorigin />
    <!-- Editorial hero fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" /></noscript>
    <!--
      No canonical, description, OG or Twitter tags here on purpose. Every route
      sets its own through PageSEO (react-helmet-async), and Helmet can only
      manage tags it rendered itself — a static copy here is not replaced, it is
      duplicated. That produced two canonicals on every page, one of them
      pointing at the homepage. The title element below is the only exception:
      Helmet treats title as a singleton and replaces it cleanly, so it stays
      as the fallback for any route that sets none.
    -->
    <title>Naira Flore | Indo-Western Wear &amp; Demi-Fine Jewellery</title>
    <meta name="author" content="Naira Flore" />
    <meta name="google-site-verification" content="Zg1NQwy9KQ09S80BpFx2PH2tqonPEhdKhFk2nmSkdCI" />

    <!-- Meta Pixel Code
         fbevents.js (~108 KB) plus its config payload (~135 KB) were downloading
         alongside the app bundle and stealing bandwidth/CPU from first paint on
         mobile. The fbq() stub is installed immediately so every track() call the
         app makes is queued and replayed; only the network fetch waits for the
         page to go idle (or the first interaction, whichever comes first). No
         events are lost, including PageView. -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];f.__fbLoad=function(){if(f.__fbLoaded)return;f.__fbLoaded=1;
      t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1232524215695667');
      fbq('track', 'PageView');
      (function(){
        var go = function(){ window.__fbLoad(); };
        ['pointerdown','keydown','touchstart','scroll'].forEach(function(ev){
          window.addEventListener(ev, go, { once: true, passive: true });
        });
        var idle = function(){ 'requestIdleCallback' in window
          ? requestIdleCallback(go, { timeout: 3000 }) : setTimeout(go, 2500); };
        document.readyState === 'complete' ? idle() : window.addEventListener('load', idle);
      })();
    </script>
    <!-- End Meta Pixel Code -->






  <!--
    The Organization node is emitted by src/pages/Index.tsx via `organizationLd`
    (src/data/seoContent.ts). It is deliberately NOT duplicated here: Helmet only
    manages tags it renders itself, so a static copy here cannot be merged or
    removed at runtime and would ship two conflicting Organization nodes.
    The WebSite block below has no React equivalent, so it stays. Its SearchAction
    was removed: it advertised /shop?q=, but ShopAll reads only `category` and site
    search is an in-overlay filter that never navigates — so the sitelinks-searchbox
    claim was false and the URL returned the unfiltered shop.
  -->
  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"WebSite","name":"Naira Flore","url":"https://nairaflore.com/"}
  </script>
</head>

  <body>
    <!-- Meta Pixel noscript fallback -->
    <noscript>
      <img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=1232524215695667&ev=PageView&noscript=1"
        alt="" />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
