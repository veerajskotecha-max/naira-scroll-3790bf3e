<!doctype html>
<html><head><meta charset="utf-8"><title>Naira Flore, email signature</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--ivory:#FBF3EC;--ink:#1A1614;--gold:#C99A4C;--gold-deep:#B0843A}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:600px;height:200px;overflow:hidden}
  body{background:var(--ivory);font-family:'Jost',sans-serif}
  .card{
    width:600px;height:200px;padding:26px 30px 0;
    display:flex;flex-direction:column;
  }
  .top{display:flex;align-items:center;flex:1}
  .wordmark{width:176px;height:auto;display:block;flex:none}
  .divider{width:1px;height:76px;background:var(--gold);margin:0 26px;flex:none}
  .who{display:flex;flex-direction:column;justify-content:center}
  .name{
    font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;
    line-height:1.1;color:var(--ink);
  }
  .role{
    margin-top:7px;font-size:11px;font-weight:400;letter-spacing:.28em;
    text-transform:uppercase;color:var(--gold-deep);
  }
  .rule{height:1px;background:rgba(201,154,76,.55);margin:0 0 0}
  .contact{
    height:44px;display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:11px;font-weight:400;letter-spacing:.06em;color:var(--ink);
    white-space:nowrap;
  }
  .contact .dot{color:var(--gold);font-size:12px}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <img class="wordmark" src="logo-wordmark.png" alt="Naira Flore">
      <div class="divider"></div>
      <div class="who">
        <div class="name">Full Name</div>
        <div class="role">Role Title, Naira Flore</div>
      </div>
    </div>
    <div class="rule"></div>
    <div class="contact">
      <span>WhatsApp +91 95615 57935</span>
      <span class="dot">&middot;</span>
      <span>shopatnaira@gmail.com</span>
      <span class="dot">&middot;</span>
      <span>nairaflore.com</span>
    </div>
  </div>
</body></html>
