<!doctype html>
<html><head><meta charset="utf-8"><title>Naira Flore, highlight cover, Bracelets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--ivory:#FBF3EC;--ink:#1A1614;--gold:#C99A4C}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{background:var(--ink);display:flex;align-items:center;justify-content:center}
  .disc{
    width:640px;height:640px;border-radius:50%;
    border:1px solid rgba(201,154,76,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .icon{width:250px;height:250px;display:block}
  .label{
    margin-top:58px;font-family:'Jost',sans-serif;font-weight:300;font-size:44px;
    letter-spacing:.46em;text-indent:.46em;text-transform:uppercase;color:var(--ivory);
  }
</style>
</head>
<body>
  <div class="disc">
    <svg class="icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M44 32 A 34 34 0 1 0 76 32" stroke="#C99A4C" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="44" cy="32" r="4.5" fill="#C99A4C"/>
      <circle cx="76" cy="32" r="4.5" fill="#C99A4C"/>
      <circle cx="60" cy="96" r="2.2" fill="#C99A4C"/>
    </svg>
    <div class="label">Bracelets</div>
  </div>
</body></html>
