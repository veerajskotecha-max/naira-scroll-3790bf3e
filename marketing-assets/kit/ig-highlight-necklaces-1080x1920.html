<!doctype html>
<html><head><meta charset="utf-8"><title>Naira Flore, highlight cover, Necklaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--ivory:#FBF3EC;--ink:#1A1614;--gold:#C99A4C}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{background:var(--ink);display:flex;align-items:center;justify-content:center}
  .disc{
    width:640px;height:640px;border-radius:50%;
    border:1px solid rgba(201,154,76,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .icon{width:250px;height:250px;display:block}
  .label{
    margin-top:58px;font-family:'Jost',sans-serif;font-weight:300;font-size:44px;
    letter-spacing:.46em;text-indent:.46em;text-transform:uppercase;color:var(--ivory);
  }
</style>
</head>
<body>
  <div class="disc">
    <svg class="icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 30 C 34 66, 86 66, 100 30" stroke="#C99A4C" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M60 57 V 68" stroke="#C99A4C" stroke-width="2"/>
      <path d="M60 68 L70 79 L60 94 L50 79 Z" stroke="#C99A4C" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M50 79 H70" stroke="#C99A4C" stroke-width="1.3"/>
    </svg>
    <div class="label">Necklaces</div>
  </div>
</body></html>
