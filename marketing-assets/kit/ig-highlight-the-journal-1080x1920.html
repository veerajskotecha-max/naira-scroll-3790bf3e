<!doctype html>
<html><head><meta charset="utf-8"><title>Naira Flore, highlight cover, The Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--ivory:#FBF3EC;--ink:#1A1614;--gold:#C99A4C}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{background:var(--ink);display:flex;align-items:center;justify-content:center}
  .disc{
    width:640px;height:640px;border-radius:50%;
    border:1px solid rgba(201,154,76,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .icon{width:250px;height:250px;display:block}
  .label{
    margin-top:58px;font-family:'Jost',sans-serif;font-weight:300;font-size:42px;
    letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;color:var(--ivory);
    white-space:nowrap;
  }
</style>
</head>
<body>
  <div class="disc">
    <svg class="icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M60 40 C 50 32, 36 31, 25 36 L25 84 C 36 79, 50 80, 60 88" stroke="#C99A4C" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M60 40 C 70 32, 84 31, 95 36 L95 84 C 84 79, 70 80, 60 88" stroke="#C99A4C" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M60 40 V 88" stroke="#C99A4C" stroke-width="1.6"/>
      <path d="M70 60 C 76 56, 82 55, 86 57" stroke="#C99A4C" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M78 57 C 77 51, 80 47, 84 46 C 87 50, 86 55, 81 57 Z" stroke="#C99A4C" stroke-width="1.3"/>
    </svg>
    <div class="label">The Journal</div>
  </div>
</body></html>
