<!doctype html>
<html><head><meta charset="utf-8"><title>Naira Flore, Instagram profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF3EC; --ink:#1A1614; --gold:#C99A4C; --gold-deep:#B0843A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1000px;height:1000px;overflow:hidden}
  body{
    background:var(--ivory);
    display:flex;align-items:center;justify-content:center;
  }
  /* Everything sits well inside the circular crop Instagram applies. */
  .lockup{display:flex;flex-direction:column;align-items:center;transform:translateY(-6px)}
  .wordmark{width:620px;height:auto;display:block}
  .rule{width:54px;height:1px;background:var(--gold);margin:44px 0 34px}
  .sub{
    font-family:'Jost',sans-serif;font-weight:400;font-size:31px;
    letter-spacing:.58em;text-indent:.58em;color:var(--ink);
    text-transform:uppercase;
  }
</style>
</head>
<body>
  <div class="lockup">
    <img class="wordmark" src="logo-wordmark.png" alt="Naira">
    <div class="rule"></div>
    <div class="sub">Flore</div>
  </div>
</body></html>
