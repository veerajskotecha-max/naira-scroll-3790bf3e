<!doctype html>
<html><head><meta charset="utf-8"><title>Naira Flore, WhatsApp Business profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF3EC; --ink:#1A1614; --gold:#C99A4C; --gold-deep:#B0843A; --blush:#FFBDA8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1000px;height:1000px;overflow:hidden}
  body{background:var(--ivory);display:flex;align-items:center;justify-content:center}
  .medallion{
    width:660px;height:660px;border:1.5px solid var(--gold);border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .monogram{
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:250px;line-height:1;color:var(--ink);
    letter-spacing:-0.02em;display:flex;align-items:baseline;
  }
  .monogram .f{color:var(--gold-deep);margin-left:-14px}
  .flower{margin-top:26px;margin-bottom:26px}
  .name{
    font-family:'Jost',sans-serif;font-weight:400;font-size:30px;
    letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:var(--ink);
  }
</style>
</head>
<body>
  <div class="medallion">
    <div class="monogram"><span>N</span><span class="f">F</span></div>
    <svg class="flower" width="72" height="46" viewBox="0 0 72 46" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 42 C 22 40, 32 34, 38 24" stroke="#C99A4C" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M20 38 C 24 30, 22 26, 16 24 C 14 30, 15 35, 20 38 Z" stroke="#C99A4C" stroke-width="1.4" fill="#FFBDA8" fill-opacity=".38"/>
      <path d="M38 24 C 34 14, 38 7, 46 5 C 52 10, 52 18, 44 23 Z" stroke="#C99A4C" stroke-width="1.5" fill="#FFBDA8" fill-opacity=".5"/>
      <path d="M44 23 C 52 20, 60 22, 64 28 C 58 33, 50 32, 44 26 Z" stroke="#C99A4C" stroke-width="1.5" fill="#FFBDA8" fill-opacity=".3"/>
    </svg>
    <div class="name">Naira Flore</div>
  </div>
</body></html>
